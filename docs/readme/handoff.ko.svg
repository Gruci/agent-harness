<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" role="img" aria-label="세션 1 이 레포에 남긴 것(열린 과업, 설계서와 결정, 사유와 함께 남은 거절 제안, 검사가 되는 교훈, 관례, 훅으로 도는 규칙)을 세션 2 와 Codex 가 읽고 이어서 일한다.">
<style>
.title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;fill:#e6edf3}
.sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13px;fill:#8b949e}
.row{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600;fill:#e6edf3}
.how{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#8b949e}
.edge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12px;fill:#8b949e}
.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;fill:#e6edf3}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker></defs>
<rect width="900" height="444" rx="12" fill="#0d1117"/>
<rect x="16" y="139" width="180" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="30" y="169" class="title">세션 1 · 월요일</text><text x="30" y="193" class="sub">범위 합의</text><text x="30" y="215" class="sub">설계서 작성</text><text x="30" y="237" class="sub">과업 절반 진행</text>
<rect x="248" y="40" width="404" height="330" rx="10" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
<text x="266" y="72" class="title">레포가 기억한다</text>
<text x="266" y="104" class="row">열린 과업</text><text x="266" y="123" class="how">작업을 시작할 때 보드에 올리고, 다음 세션이 받아 본다</text><text x="266" y="150" class="row">설계서와 결정</text><text x="266" y="169" class="how">코드보다 먼저 파일로 쓰고, 사용자가 승인한다</text><text x="266" y="196" class="row">거절한 제안</text><text x="266" y="215" class="how">사유와 함께 적어 두어, 같은 제안을 다시 꺼내지 않는다</text><text x="266" y="242" class="row">사고 → 검사</text><text x="266" y="261" class="how">실수는 경위를 적고, 검사할 수 있으면 게이트로 올린다</text><text x="266" y="288" class="row">관례</text><text x="266" y="307" class="how">한 곳에 등재하고, 이름만 바꾼 재구현은 잡아낸다</text><text x="266" y="334" class="row">규칙은 훅으로</text><text x="266" y="353" class="how">저장할 때 · 세션이 끝날 때 · push 전에 돈다</text>
<rect x="704" y="80" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="718" y="110" class="title">세션 2 · 목요일</text><text x="718" y="134" class="sub">열린 과업을 읽고</text><text x="718" y="156" class="sub">설계서 다음 단계부터</text>
<rect x="704" y="220" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="718" y="250" class="title">Codex</text><text x="718" y="274" class="sub">같은 규칙</text><text x="718" y="296" class="sub">같은 검사</text>
<path d="M198,205 L244,205" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><text x="221" y="196" text-anchor="middle" class="edge">남긴다</text><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M198,205 L244,205"/></circle>
<path d="M654,135 L700,135" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><text x="677" y="126" text-anchor="middle" class="edge">읽는다</text><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M654,135 L700,135"/></circle>
<path d="M654,275 L700,275" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><text x="677" y="266" text-anchor="middle" class="edge">읽는다</text><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M654,275 L700,275"/></circle>
<text x="450" y="414" text-anchor="middle" class="tag">세션은 바뀌어도, 일하는 사람은 한 명.</text>
</svg>
