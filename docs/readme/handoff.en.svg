<svg xmlns="http://www.w3.org/2000/svg" width="900" height="388" viewBox="0 0 900 388" role="img" aria-label="Today, three agent sessions work on separate tasks at the same time and write into one harness; tomorrow, the next agent reads it and picks up a task at the plan's next step. The harness holds the task board, plans and decisions, conventions, and the checks that run as hooks.">
<style>
.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;fill:#8b949e}
.name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;fill:#e6edf3}
.sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13px;fill:#8b949e}
.row{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600;fill:#e6edf3}
.how{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#8b949e}
.edge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12px;fill:#8b949e}
.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;fill:#e6edf3}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
<marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#30363d"/></marker>
</defs>
<rect width="900" height="388" rx="12" fill="#0d1117"/>
<text x="24" y="36" class="label">TODAY · AT THE SAME TIME</text>
<path d="M230,32 L662,32" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#time)"/>
<text x="676" y="36" class="label">TOMORROW</text>
<rect x="24" y="56" width="200" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="44" cy="80" r="5" fill="#2f81f7"/><text x="56" y="85" class="name">Agent 1</text><text x="38" y="110" class="sub">task: login</text>
<rect x="24" y="140" width="200" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="44" cy="164" r="5" fill="#2f81f7"/><text x="56" y="169" class="name">Agent 2</text><text x="38" y="194" class="sub">task: payments</text>
<rect x="24" y="224" width="200" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="44" cy="248" r="5" fill="#2f81f7"/><text x="56" y="253" class="name">Agent 3</text><text x="38" y="278" class="sub">task: alerts</text>
<rect x="278" y="52" width="344" height="248" rx="12" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
<text x="298" y="84" class="name">dev-harness</text><text x="298" y="104" class="how">one harness under every session</text>
<path d="M298,122 L602,122 M450,134 L450,286 M298,210 L602,210" stroke="#30363d" stroke-width="1"/>
<text x="298" y="156" class="row">Task board</text><text x="298" y="176" class="how">who works on what</text>
<text x="466" y="156" class="row">Plans &amp; decisions</text><text x="466" y="176" class="how">written before code</text>
<text x="298" y="244" class="row">Conventions</text><text x="298" y="264" class="how">mistakes become checks</text>
<text x="466" y="244" class="row">Checks as hooks</text><text x="466" y="264" class="how">same for every agent</text>
<rect x="676" y="128" width="200" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="696" cy="152" r="5" fill="#2f81f7"/><text x="708" y="157" class="name">Next agent</text><text x="690" y="182" class="sub">picks up “login”</text><text x="690" y="204" class="sub">at the plan’s next step</text>
<path d="M228,92 L272,92" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M228,92 L272,92"/></circle>
<path d="M228,176 L272,176" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="-0.7s" repeatCount="indefinite" path="M228,176 L272,176"/></circle>
<path d="M228,260 L272,260" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="-1.4s" repeatCount="indefinite" path="M228,260 L272,260"/></circle>
<path d="M626,176 L670,176" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M626,176 L670,176"/></circle>
<text x="250" y="80" text-anchor="middle" class="edge">writes</text>
<text x="648" y="164" text-anchor="middle" class="edge">reads</text>
<text x="450" y="352" text-anchor="middle" class="tag">Sessions change. The engineer doesn’t.</text>
</svg>
