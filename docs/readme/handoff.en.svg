<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" role="img" aria-label="Session 1 hands work to session 2 and Codex through what the repo keeps: open tasks, plans and decisions, rejected ideas with their reasons, lessons that become checks, conventions, and rules that run as hooks.">
<style>
.title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;fill:#e6edf3}
.sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13px;fill:#8b949e}
.row{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600;fill:#e6edf3}
.how{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#8b949e}
.edge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12px;fill:#8b949e}
.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;fill:#e6edf3}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker></defs>
<rect width="900" height="444" rx="12" fill="#0d1117"/>
<rect x="16" y="139" width="180" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="30" y="169" class="title">Session 1 · Monday</text><text x="30" y="193" class="sub">scope agreed</text><text x="30" y="215" class="sub">plan written</text><text x="30" y="237" class="sub">task half done</text>
<rect x="248" y="40" width="404" height="330" rx="10" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
<text x="266" y="72" class="title">The repo remembers</text>
<text x="266" y="104" class="row">Open task</text><text x="266" y="123" class="how">On the board from the start; the next session sees it</text><text x="266" y="150" class="row">Plans and decisions</text><text x="266" y="169" class="how">Written to a file before any code, approved by you</text><text x="266" y="196" class="row">Rejected ideas</text><text x="266" y="215" class="how">Recorded with the reason, so they aren&#x27;t proposed again</text><text x="266" y="242" class="row">Lessons → checks</text><text x="266" y="261" class="how">Each mistake is written up, and becomes a check if it can</text><text x="266" y="288" class="row">Conventions</text><text x="266" y="307" class="how">One list; a renamed copy of a helper gets caught</text><text x="266" y="334" class="row">Rules as hooks</text><text x="266" y="353" class="how">Run on every save, at session end and before push</text>
<rect x="704" y="80" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="718" y="110" class="title">Session 2 · Thursday</text><text x="718" y="134" class="sub">reads the open task</text><text x="718" y="156" class="sub">continues from the plan</text>
<rect x="704" y="220" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="718" y="250" class="title">Codex</text><text x="718" y="274" class="sub">same rules</text><text x="718" y="296" class="sub">same checks</text>
<path d="M198,205 L244,205" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><text x="221" y="196" text-anchor="middle" class="edge">writes</text><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M198,205 L244,205"/></circle>
<path d="M654,135 L700,135" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><text x="677" y="126" text-anchor="middle" class="edge">reads</text><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M654,135 L700,135"/></circle>
<path d="M654,275 L700,275" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><text x="677" y="266" text-anchor="middle" class="edge">reads</text><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M654,275 L700,275"/></circle>
<text x="450" y="414" text-anchor="middle" class="tag">Sessions change. The engineer doesn't.</text>
</svg>
