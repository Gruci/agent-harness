<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424" role="img" aria-label="One harness under every agent and session: today three sessions — Claude Code, Codex and Claude Code — work on separate tasks at the same time, and tomorrow a new session picks up a task where the plan left off. All of them read and write the same task board, plans and decisions, conventions and lessons, and run the same checks as hooks.">
<style>
.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.04em;fill:#8b949e}
.title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;fill:#e6edf3}
.name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;fill:#e6edf3}
.sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13px;fill:#8b949e}
.row{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600;fill:#e6edf3}
.how{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#8b949e}
.edge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:12px;fill:#8b949e}
.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;fill:#e6edf3}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker></defs>
<rect width="900" height="424" rx="12" fill="#0d1117"/>
<text x="24" y="36" class="label">TODAY · THREE SESSIONS AT THE SAME TIME</text>
<text x="684" y="36" class="label">TOMORROW · A NEW SESSION</text>
<path d="M660,28 L660,160" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="24" y="50" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="44" cy="73" r="5" fill="#d97757"/><text x="56" y="78" class="name">Claude Code</text><text x="38" y="104" class="sub">task: login</text><text x="38" y="126" class="sub">in its own worktree</text>
<rect x="232" y="50" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="252" cy="73" r="5" fill="#10a37f"/><text x="264" y="78" class="name">Codex</text><text x="246" y="104" class="sub">task: payments</text><text x="246" y="126" class="sub">in its own worktree</text>
<rect x="440" y="50" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="460" cy="73" r="5" fill="#d97757"/><text x="472" y="78" class="name">Claude Code</text><text x="454" y="104" class="sub">task: alerts</text><text x="454" y="126" class="sub">in its own worktree</text>
<rect x="684" y="50" width="192" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="700" cy="73" r="5" fill="#d97757"/><circle cx="712" cy="73" r="5" fill="#10a37f"/><text x="724" y="78" class="name">Either agent</text><text x="698" y="104" class="sub">picks up “login”</text><text x="698" y="126" class="sub">at the plan’s next step</text>
<path d="M122,158 L122,202" stroke="#3d444d" stroke-width="2" fill="none" marker-start="url(#head)" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M122,158 L122,202"/></circle>
<path d="M330,158 L330,202" stroke="#3d444d" stroke-width="2" fill="none" marker-start="url(#head)" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite" path="M330,202 L330,158"/></circle>
<path d="M538,158 L538,202" stroke="#3d444d" stroke-width="2" fill="none" marker-start="url(#head)" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M538,158 L538,202"/></circle>
<path d="M780,158 L780,202" stroke="#3d444d" stroke-width="2" fill="none" marker-start="url(#head)" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" path="M780,202 L780,158"/></circle>
<text x="434" y="185" text-anchor="middle" class="edge">same rules · same checks</text>
<text x="770" y="185" text-anchor="end" class="edge">continues today’s work</text>
<rect x="24" y="206" width="852" height="150" rx="12" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
<text x="44" y="236" class="name">agent-harness</text><text x="162" y="236" class="how">one harness under every agent and session</text>
<path d="M245,254 L245,326 M456,254 L456,326 M667,254 L667,326" stroke="#30363d" stroke-width="1"/>
<text x="44" y="272" class="row">Task board</text><text x="44" y="294" class="how">who works on what</text><text x="44" y="314" class="how">sessions never collide</text>
<text x="266" y="272" class="row">Plans &amp; decisions</text><text x="266" y="294" class="how">written before any code</text><text x="266" y="314" class="how">read by the next session</text>
<text x="477" y="272" class="row">Conventions &amp; lessons</text><text x="477" y="294" class="how">one registry</text><text x="477" y="314" class="how">mistakes become checks</text>
<text x="688" y="272" class="row">Checks as hooks</text><text x="688" y="294" class="how">on save, at end, before merge</text><text x="688" y="314" class="how">the same for both agents</text>
<text x="450" y="398" text-anchor="middle" class="tag">Sessions change. The engineer doesn’t.</text>
</svg>
